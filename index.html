<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Animal Observer</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="/scripts/main.js"></script>
  </head>
  <body>
    <div id="loadingScreen"></div>

    <img id="menu" src="./assets/images/UI/TitleRev2.png" alt="Animal Observer" />

    <div id="sky">
      <div id="layer1Background"></div>
      <div id="layer3Background"></div>
      <img src="./assets/images/UI/monster.png" id="monster" alt="" />

      <div id="layer2Background">
        <canvas id="gameCanvas" aria-label="Animal observation area"></canvas>

        <button id="startGameButton" type="button">
          <img id="startGameImage" src="./assets/images/UI/startCloud.png" alt="Start Animal Observer" />
        </button>

        <div id="tutorialScreen" hidden>
          <img id="tutorialImage" src="./assets/images/UI/tutorial.sprite.png" alt="Tutorial illustration" />
          <img id="murderGif" src="./assets/images/UI/murder.gif" alt="Animated tutorial illustration" />
          <button id="cloudButton" type="button">Continue</button>
        </div>

        <div id="hud" aria-live="polite">
          <div id="gameCountdown">Ready</div>
          <div id="scorePanel">
            <span id="roundLabel">Round 1</span>
            <span id="ecosystemLabel">Field</span>
            <span id="scoreLabel">Score 0</span>
          </div>
        </div>

        <section id="clipboardContainer" hidden>
          <img id="clipboardImage" src="./assets/images/UI/R1clipboard.png" alt="" draggable="false" />

          <form id="guessPage" novalidate>
            <div id="clipboardTitle">Observation report</div>
            <div id="clipboardSubtitle">Round 1 — Field</div>
            <div id="guessFields"></div>
            <p id="guessError" role="alert"></p>
            <button id="submitGuessButton" type="submit">Proceed</button>
          </form>

          <section id="resultPage" hidden>
            <div id="resultSummary">Round results</div>
            <div id="resultRows"></div>
            <div id="scoreSummary"></div>
            <button id="nextRoundButton" type="button">Next round</button>
          </section>
        </section>
      </div>
    </div>
  </body>
</html>
