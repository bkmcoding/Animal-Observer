<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Observer</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="/scripts/main.js"></script>
  </head>
  <body>
    <div id="loadingScreen"></div>
    <img id="menu" src="./assets/images/UI/TitleRev2.png" alt="Animal Observer" />

    <div id="sky">
      <div id="layer1Background"></div>
      <div id="layer3Background"></div>
      <img src="./assets/images/UI/monster.png" id="monster" alt="" />
      <div id="layer2Background">
        <canvas id="gameCanvas" aria-label="Animal observation area"></canvas>

        <button id="startGameButton" type="button">
          <img id="startGameImage" src="./assets/images/UI/startCloud.png" alt="Start Animal Observer" />
        </button>

        <div id="tutorialScreen" hidden>
          <img src="./assets/images/UI/tutorial.sprite.png" alt="Tutorial illustration" />
          <div id="tutorialText">
            <h2>How to play</h2>
            <p>Watch the animals for 50 seconds and count each capture.</p>
            <p>Close guesses still earn points, and an exact report earns a perfect bonus.</p>
          </div>
          <button id="cloudButton" type="button">Continue</button>
        </div>

        <div id="hud" aria-live="polite">
          <div id="gameCountdown">Ready</div>
          <div id="scorePanel">
            <span id="roundLabel">Round 1</span>
            <span id="ecosystemLabel">Field</span>
            <span id="scoreLabel">Score 0</span>
          </div>
        </div>

        <section id="clipboardContainer" hidden>
          <form id="guessPage" class="clipboard-page" novalidate>
            <h2 id="clipboardTitle">Observation report</h2>
            <p id="clipboardSubtitle">Round 1 — Field</p>
            <div id="guessFields"></div>
            <p id="guessError" role="alert"></p>
            <button id="submitGuessButton" class="clipboard-button" type="submit">
              Submit counts
            </button>
          </form>

          <section id="resultPage" class="clipboard-page" hidden>
            <h2>Round results</h2>
            <p id="resultSummary">Round results</p>
            <div id="resultRows"></div>
            <p id="scoreSummary"></p>
            <button id="nextRoundButton" class="clipboard-button" type="button">
              Next round
            </button>
          </section>
        </section>
      </div>
    </div>
  </body>
</html>
